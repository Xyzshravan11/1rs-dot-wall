<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1Rs 1 Dot Wall - India</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center}
#top{padding:12px;background:#ffde00;color:#000;font-weight:bold;font-size:18px}
canvas{border:2px solid #444;background:#fff;max-width:95vw;margin-top:10px}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;z-index:10}
#box{background:#fff;color:#000;padding:20px;border-radius:12px;width:90%;max-width:320px}
button{padding:10px 15px;border:none;border-radius:6px;font-weight:bold}
.buy{background:#00c853;color:#fff}
</style>
</head>
<body>
<div id="top">🇮🇳 1,000,000 DOTS - 1 DOT = 1 RUPEE</div>
<p>Khali: <span id="left">0</span> | Bike: <span id="sold">0</span></p>
<canvas id="c" width="1000" height="1000"></canvas>
<div id="modal"><div id="box">
<h3 id="dnum">Dot #0</h3>
<input type="file" id="img" accept="image/*"><br><br>
<img id="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=upi@ok&am=1" width="120"><p>UPI ID: yourname@upi<br>Amount: 1 Rs</p>
<button class="buy" onclick="buy()">Payment Kiya, Dot Mera Karo</button>
<button onclick="document.getElementById('modal').style.display='none'" style="background:#eee">Cancel</button>
</div></div>
<script>
const S=100; let dots=JSON.parse(localStorage.getItem('dots')||'{}'), sel=null;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
function draw(){
ctx.fillStyle='#fff';ctx.fillRect(0,0,1000,1000);
for(let y=0;y<S;y++)for(let x=0;x<S;x++){
let id=y*S+x; if(dots[id]){let im=new Image(); im.src=dots[id]; ctx.drawImage(im,x*10,y*10,10,10);}
else{ctx.fillStyle='#e0e0e0'; ctx.fillRect(x*10+1,y*10+1,8,8);}
}
document.getElementById('sold').innerText=Object.keys(dots).length;
document.getElementById('left').innerText=S*S-Object.keys(dots).length;
}
cv.addEventListener('click',e=>{
let r=cv.getBoundingClientRect(); let x=Math.floor((e.clientX-r.left)/r.width*S); let y=Math.floor((e.clientY-r.top)/r.height*S);
sel=y*S+x; if(dots[sel])return alert('Ye bik chuka hai'); document.getElementById('dnum').innerText='Dot #'+sel;
document.getElementById('modal').style.display='flex';
});
function buy(){
let f=document.getElementById('img').files[0]; if(!f)return alert('Logo select karo');
let rd=new FileReader(); rd.onload=e=>{dots[sel]=e.target.result; localStorage.setItem('dots',JSON.stringify(dots)); document.getElementById('modal').style.display='none'; draw(); alert('Dot Kharid Liya!');}; rd.readAsDataURL(f);
}
draw();
</script>
</body>
  </html>
