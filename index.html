<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1,000,000 DOTS WALL</title>
<style>
body{margin:0;background:#080808;color:#fff;font-family:system-ui;text-align:center}
#top{background:#ffe600;color:#000;padding:12px;font-weight:900;font-size:16px}
canvas{background:#fff;width:98vw;max-width:1000px;aspect-ratio:1;border:3px solid #fff;margin:10px auto;display:block;cursor:crosshair}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:999;overflow-y:auto;padding:10px}
#box{background:#fff;color:#000;padding:20px;border-radius:16px;max-width:360px;width:95%}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}
.buy{background:#00c853;color:#fff}.pay{background:#6200ea;color:#fff}.place{background:#ff3d00;color:#fff}
.step{display:none}.step.active{display:block}
input{width:92%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:8px}
#preview{width:100%;max-width:200px;margin:10px auto;display:none;border-radius:8px;border:2px solid #000}
</style>
</head>
<body>
<div id="top">1,000,000 DOTS WALL - BUY 1 BLOCK FOR ₹100</div>
<canvas id="wall" width="1000" height="1000"></canvas>

<div id="modal">
  <div id="box">
    <!-- STEP 1 -->
    <div id="step1" class="step active">
      <h3>Block <span id="blk">20,20</span> - 100 Rs</h3>
      <input id="name" placeholder="Brand / Your Name">
      <input id="link" placeholder="Insta / Website Link">
      <button class="btn buy" onclick="goStep2()">Continue - 100 Rs</button>
      <button class="btn" style="background:#ddd" onclick="closeModal()">Cancel</button>
    </div>
    <!-- STEP 2 - PAYMENT -->
    <div id="step2" class="step">
      <h3>STEP 1: UPI Pay Karo (100 Rs)</h3>
      <img id="qr" src="" style="width:250px;margin:10px auto;display:block"/>
      <p><b>UPI: dk8811pvt@ptyes</b><br>Block: <span id="blk2">20,20</span><br>Amount: <b>₹100</b></p>
      <button class="btn pay" onclick="payNow()">📱 PhonePe/GPay Se Pay Karo</button>
      <p style="font-size:11px;margin-top:8px">Pay karne ke baad niche wala button dabao</p>
      <button class="btn" style="background:#000;color:#fff" onclick="goStep3()">✅ Maine Pay Kar Diya - Poster Lagao</button>
      <button class="btn" style="background:#ddd" onclick="closeModal()">Close</button>
    </div>
    <!-- STEP 3 - POSTER UPLOAD -->
    <div id="step3" class="step">
      <h3>STEP 2: Brand Poster Lagao</h3>
      <p style="font-size:13px">100 Rs Paid! Ab apna poster/logo upload karo</p>
      <input type="file" id="poster" accept="image/*">
      <img id="preview" />
      <button class="btn place" onclick="placePoster()">🔥 Wall Pe Lagao</button>
      <button class="btn" style="background:#ddd" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('wall');
const ctx = canvas.getContext('2d');
let selectedX=20, selectedY=20;
let uploadedImg = null;

const MY_UPI = "dk8811pvt@ptyes";
const MY_NAME = "DotWall";
const AMOUNT = 100;
const BLOCK_SIZE = 100; // Poster ka size

// Grid banao
ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,1000,1000);
drawGrid();
loadSavedPosters();

function drawGrid(){
  ctx.strokeStyle="#eeeeee";
  ctx.lineWidth=0.5;
  for(let i=0;i<=1000;i+=10){
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,1000); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(1000,i); ctx.stroke();
  }
}

function loadSavedPosters(){
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key.startsWith("poster_")){
      const parts = key.split("_");
      const x = parseInt(parts[1]); const y = parseInt(parts[2]);
      const imgData = localStorage.getItem(key);
      const img = new Image();
      img.src = imgData;
      img.onload = ()=>{ ctx.drawImage(img, x, y, BLOCK_SIZE, BLOCK_SIZE); }
    }
  }
}

canvas.addEventListener('click', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (1000 / rect.width);
  const y = (e.clientY - rect.top) * (1000 / rect.height);
  selectedX = Math.floor(x/BLOCK_SIZE)*BLOCK_SIZE;
  selectedY = Math.floor(y/BLOCK_SIZE)*BLOCK_SIZE;
  document.getElementById('blk').innerText = selectedX+","+selectedY;
  document.getElementById('blk2').innerText = selectedX+","+selectedY;
  document.getElementById('modal').style.display='flex';
  document.getElementById('step1').classList.add('active');
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step3').classList.remove('active');
});

function closeModal(){ document.getElementById('modal').style.display='none'; }

function goStep2(){
  if(document.getElementById('name').value.trim()==""){ alert("Brand Name likh de bhai"); return; }
  const note = `DotWall Block ${selectedX},${selectedY}`;
  const upiData = `upi://pay?pa=${MY_UPI}&pn=${MY_NAME}&am=${AMOUNT}&cu=INR&tn=${encodeURIComponent(note)}`;
  const qrLink = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upiData)}`;
  document.getElementById('qr').src = qrLink;
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
}

function payNow(){
  const note = `DotWall Block ${selectedX},${selectedY}`;
  const upiLink = `upi://pay?pa=${MY_UPI}&pn=${MY_NAME}&am=${AMOUNT}&cu=INR&tn=${encodeURIComponent(note)}`;
  window.location.href = upiLink;
}

function goStep3(){
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step3').classList.add('active');
}

document.getElementById('poster').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    uploadedImg = new Image();
    uploadedImg.src = ev.target.result;
    document.getElementById('preview').src = ev.target.result;
    document.getElementById('preview').style.display='block';
  }
  reader.readAsDataURL(file);
});

function placePoster(){
  if(!uploadedImg){ alert("Pehle poster select kar"); return; }
  ctx.drawImage(uploadedImg, selectedX, selectedY, BLOCK_SIZE, BLOCK_SIZE);
  ctx.strokeStyle="#000"; ctx.lineWidth=2; ctx.strokeRect(selectedX, selectedY, BLOCK_SIZE, BLOCK_SIZE);

  localStorage.setItem(`poster_${selectedX}_${selectedY}`, uploadedImg.src);
  localStorage.setItem(`name_${selectedX}_${selectedY}`, document.getElementById('name').value);
  localStorage.setItem(`link_${selectedX}_${selectedY}`, document.getElementById('link').value);

  alert("Done bhai! Tera brand poster Block "+selectedX+","+selectedY+" pe lag gaya 🔥");
  closeModal();
}
</script>
</body>
</html>
