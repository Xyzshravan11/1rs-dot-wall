<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1,000,000 DOTS WALL - Pawayan UP</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;background:#080808;color:#fff;font-family:system-ui;text-align:center;overflow-x:hidden}
#top{background:#ffe600;color:#000;padding:14px;font-weight:900;font-size:16px;position:sticky;top:0;z-index:100}
canvas{background:#fff;width:98vw;max-width:1000px;aspect-ratio:1;border:3px solid #fff;margin:10px auto;display:block;cursor:crosshair;image-rendering:pixelated;box-shadow:0 0 40px rgba(255,230,0,.2)}
#info{color:#aaa;font-size:12px;margin:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:999;padding:10px}
#box{background:#fff;color:#000;padding:22px;border-radius:16px;max-width:380px;width:95%;text-align:left}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:2px solid #ddd;font-size:15px;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}
#qr{background:#f6f6f6;padding:10px;border-radius:12px;text-align:center;margin:10px 0}
.step{display:none}.step.active{display:block}
#preview{width:100px;height:100px;object-fit:cover;border-radius:10px;display:none;margin:5px auto}
</style>
</head>
<body>
<div id="top">1,000,000 DOTS WALL - PAWAYAN UP - 1 DOT = 100 Rs - CLICK TO BUY</div>
<canvas id="wall" width="1000" height="1000"></canvas>
<div id="info">Total: 1,000,000 Dots | <span id="cord">Click karo</span></div>

<div id="modal">
<div id="box">
<button onclick="closeM()" style="float:right;width:30px;background:#eee;border-radius:50%">X</button>

<div id="step1" class="step active">
<h2>Dot <span id="dotNo"></span></h2>
<input id="nameInput" placeholder="Apna Naam likho">
<input type="file" id="imgInput" accept="image/*">
<img id="preview">
<p style="font-size:11px;color:#666">Apni photo lagao - Pawayan wall pe hamesha</p>
<button onclick="goPay()" style="background:#000;color:#ffe600">NEXT - PAYMENT PE JAO</button>
</div>

<div id="step2" class="step">
<h2>Payment Karo</h2>
<div id="qr"><div id="qrcode"></div><div id="upiText" style="font-weight:900;margin-top:5px"></div></div>
<button onclick="payUPI()" style="background:#00a000;color:#fff">UPI APP SE PAY KARO</button>
<input id="utrInput" placeholder="12 Digit UTR / Transaction ID">
<input type="file" id="ssInput" accept="image/*">
<p style="font-size:11px">UPI Screenshot yaha lagao</p>
<button id="verifyBtn" onclick="sendToTelegram()" style="background:#000;color:#ffe600">✅ TELEGRAM PE BHEJO & VERIFY KARO</button>
<button onclick="back1()" style="background:#eee;color:#000">BACK</button>
</div>

<div id="step3" class="step">
<h2 style="text-align:center">⏳ Pending Hai</h2>
<p style="text-align:center">Tera dot admin approve karega, fir Pawayan wall pe dikhega!</p>
<button onclick="closeM()" style="background:#000;color:#fff">BAND KARO</button>
</div>

</div>
</div>

<script>
// ===== FINAL CONFIG - KHALID BHAI - PAWAYAN =====
const BOT_TOKEN = "8646960629:AAE_Pdb5hH0QIZdfNZUATH8XgGqu8LaQA50";
const CHAT_ID = "6052185799";
const UPI_ID = "dk8811pvt@ptyes";
const PRICE = 100;

let selX=0, selY=0, selImgData=null, selName="";
const canvas = document.getElementById('wall');
const ctx = canvas.getContext('2d');

function loadWall(){
ctx.fillStyle="#fff"; ctx.fillRect(0,0,1000,1000);
ctx.fillStyle="#f0f0f0";
for(let i=0;i<1000;i+=10){ ctx.fillRect(i,0,1,1000); ctx.fillRect(0,i,1000,1); }
// Approved aur Pending dikhao
for(let x=0;x<1000;x++){for(let y=0;y<1000;y++){
if(localStorage.getItem(`APPROVED_${x}_${y}`)){ctx.fillStyle="#00b300";ctx.fillRect(x,y,2,2);}
else if(localStorage.getItem(`PENDING_${x}_${y}`)){ctx.fillStyle="rgba(255,193,7,0.6)";ctx.fillRect(x,y,1,1);}
}}
}
loadWall();

// Click on canvas
canvas.addEventListener('click', (e)=>{
const rect = canvas.getBoundingClientRect();
const x = Math.floor((e.clientX - rect.left)/rect.width*1000);
const y = Math.floor((e.clientY - rect.top)/rect.height*1000);
if(localStorage.getItem(`APPROVED_${x}_${y}`)){alert("Ye dot bik gaya hai!");return;}
if(localStorage.getItem(`PENDING_${x}_${y}`)){alert("Ye pending me hai!");return;}
selX=x; selY=y;
document.getElementById('cord').innerText = x+","+y;
document.getElementById('dotNo').innerText = x+","+y;
document.getElementById('modal').style.display='flex';
showStep(1);
// QR
document.getElementById('qrcode').innerHTML="";
document.getElementById('upiText').innerText = UPI_ID;
new QRCode(document.getElementById("qrcode"), {
text: `upi://pay?pa=${UPI_ID}&pn=KhalidDotWall&am=${PRICE}&cu=INR&tn=Dot ${x},${y}`,
width: 160, height: 160
});
});

function showStep(n){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById('step'+n).classList.add('active');}
function closeM(){document.getElementById('modal').style.display='none';}
function back1(){showStep(1);}

// Image preview
document.getElementById('imgInput').addEventListener('change', (e)=>{
const file = e.target.files[0]; if(!file) return;
if(file.size > 2*1024*1024){ alert("Image 2MB se kam rakho"); return; }
const r = new FileReader();
r.onload = ev=>{
selImgData = ev.target.result;
document.getElementById('preview').src = selImgData;
document.getElementById('preview').style.display='block';
};
r.readAsDataURL(file);
});

function goPay(){
const name = document.getElementById('nameInput').value.trim();
if(!name ||!selImgData){ alert("Naam aur Image dono daalo bhai"); return; }
selName = name;
localStorage.setItem('selX', selX); localStorage.setItem('selY', selY);
showStep(2);
}

function payUPI(){
const upiLink = `upi://pay?pa=${UPI_ID}&pn=Khalid&am=${PRICE}&cu=INR&tn=Dot ${selX},${selY}`;
window.location.href = upiLink;
}

// ===== MAIN TELEGRAM FUNCTION - UTR + SS - FINAL FIX =====
async function sendToTelegram(){
  const utr = document.getElementById('utrInput').value.trim();
  const fileInput = document.getElementById('ssInput');
  const file = fileInput.files[0];

  if(utr.length < 10){ alert("Sahi 12 digit UTR daalo bhai"); return; }
  if(!file){ alert("Payment ka Screenshot daalo"); return; }

  const btn = document.getElementById('verifyBtn');
  btn.innerText = "⏳ Telegram pe bhej raha hu...";
  btn.disabled = true;

  coconst fd = new FormData();
fd.append('chat_id', CHAT_ID);
fd.append('photo', file);
fd.append('caption', `💰 NEW PAYMENT - Dot Wall Pos: ${selX},${selY} - Rs. ${price}`);

  trytry {// Telegram pe payment bhejo
try {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('photo', file);
  fd.append('caption', `💰 NEW PAYMENT - Dot Wall\nPos: ${selX},${selY}\nPrice: Rs.${price}`);

  const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
    method: 'POST',
    body: fd
  });
  
  const data = await res.json();
  
  if(data.ok){
    localStorage.setItem(`PENDING_${selX}_${selY}`, 'true');
    ctx.fillStyle="rgba(255,193,7,0.6)";
    ctx.fillRect(selX, selY, 1, 1);
    showStep(3);
    alert("✅ Telegram pe chala gaya! Admin approve karega");
  } else {
    alert("Telegram Error: " + data.description);
    btn.disabled=false; 
    btn.innerText="✅ TELEGRAM SEND";
  }
} catch(err){
  alert("Network Error: " + err.message);
  btn.disabled=false; 
  btn.innerText="✅ TELEGRAM SEND";
}
  
  }
    
    const data = await res.json();
    if(data.ok){
      localStorage.setItem(`PENDING_${selX}_${selY}`, JSON.stringify({name: selName, img: selImgData, utr: utr}));
      ctx.fillStyle="rgba(255,193,7,0.6)";
      ctx.fillRect(selX, selY, 1, 1);
      showStep(3);
      alert("✅ Telegram pe chala gaya! Admin approve karega");
    } else {
      alert("Telegram Error: " + data.description + "\nPehle @dotwall_khalid_100_bot pe /start bhejo");
      btn.disabled=false; btn.innerText="✅ TELEGRAM PE BHEJO & VERIFY KARO";
    }
  }catch(err){
    alert("Network Error: " + err.message);
    btn.disabled=false; btn.innerText="✅ TELEGRAM PE BHEJO & VERIFY KARO";
  }
}
</script>
</body>
</html>
