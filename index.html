<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1M Dots Wall - 1Rs</title>
<style>
body{margin:0;background:#080808;color:#fff;font-family:system-ui;text-align:center}
#top{background:#ffe600;color:#000;padding:12px;font-weight:900;font-size:18px;position:sticky;top:0}
canvas{background:#fff;width:98vw;max-width:1000px;aspect-ratio:1/1;border:3px solid #333;cursor:crosshair}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);align-items:center;justify-content:center;z-index:99;padding:15px}
#box{background:#fff;color:#000;padding:20px;border-radius:16px;max-width:360px;width:100%}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;margin-top:10px}
.buy{background:#00c853;color:#fff}
</style>
</head>
<body>
<div id="top">🇮🇳 1,000,000 DOTS - 1 DOT = 1 Rs</div>
<p>Bika: <b id="sold">0</b> | Khali: <b id="left">1000000</b> | 10x10 Block = 100 Rs</p>
<canvas id="c" width="1000" height="1000"></canvas>
<div id="modal"><div id="box">
<h3 id="btitle"></h3>
<input type="file" id="img" accept="image/*"><br><br>
<img id="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=khalid@upi%26pn=1RsWall%26am=100" width="130"><br>
<b>UPI: khalid@upi</b><br>100 Rs<br>
<button class="btn buy" onclick="buyNow()">Payment Done - Book</button>
<button class="btn" style="background:#eee" onclick="modal.style.display='none'">Cancel</button>
</div></div>
<script>
const S=1000,B=10;let dots=JSON.parse(localStorage.getItem('1mwall')||'{}'),selKey=null,ctx=c.getContext('2d');
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);ctx.strokeStyle='#eee';for(let i=0;i<=S;i+=100){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,S);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(S,i);ctx.stroke();}for(let k in dots){let im=new Image();im.src=dots[k];let[x,y]=k.split(',').map(Number);im.onload=()=>ctx.drawImage(im,x,y,B,B);if(im.complete)ctx.drawImage(im,x,y,B,B);}sold.innerText=Object.keys(dots).length*100;left.innerText=1000000-Object.keys(dots).length*100;}
c.addEventListener('click',e=>{let r=c.getBoundingClientRect();let x=Math.floor((e.clientX-r.left)/r.width*S);let y=Math.floor((e.clientY-r.top)/r.height*S);x=Math.floor(x/B)*B;y=Math.floor(y/B)*B;let key=x+','+y;if(dots[key])return alert('Bik chuka!');selKey=key;btitle.innerText='Block '+key;modal.style.display='flex';});
function buyNow(){let f=img.files[0];if(!f)return alert('Logo chuno');let rd=new FileReader();rd.onload=ev=>{dots[selKey]=ev.target.result;localStorage.setItem('1mwall',JSON.stringify(dots));modal.style.display='none';draw();alert('Booked!');};rd.readAsDataURL(f);}
draw();
</script>
</body>
</html>
